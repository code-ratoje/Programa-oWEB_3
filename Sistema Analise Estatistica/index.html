<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Análise Estatística</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="container">
        <h1>Análise Estatística de Turma</h1>
        <p>Informe os dados iniciais para gerar o formulário de notas.</p>

        <form action="processamento.php" method="POST" id="formTurma">
            
            <div class="grupo-input">
                <label for="nomeTurma">Nome da Turma:</label>
                <input type="text" id="nomeTurma" name="nome_turma" required>
            </div>

            <div class="grupo-input">
                <label for="qtdAlunos">Quantidade de Alunos:</label>
                <input type="number" id="qtdAlunos" min="1" required>
            </div>

            <button type="button" onclick="gerarCampos()">Gerar Campos de Alunos</button>

            <div id="containerAlunos"></div>

            <button type="submit" id="btnEnviar" style="display: none;">Calcular Resultados</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
